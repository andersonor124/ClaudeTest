<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily To-Do</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Daily To-Do</h1>
      <div class="tools">
        <button type="button" id="export-btn" class="btn">Export to Excel</button>
        <button type="button" id="backup-btn" class="btn btn-quiet">Backup</button>
        <button type="button" id="restore-btn" class="btn btn-quiet">Restore</button>
        <input type="file" id="restore-file" accept="application/json,.json" hidden>
      </div>
    </header>

    <section class="day-bar" aria-label="Day">
      <button type="button" id="prev-day" class="btn btn-quiet" aria-label="Previous day">&larr;</button>
      <input type="date" id="day-picker" aria-label="Selected day">
      <button type="button" id="next-day" class="btn btn-quiet" aria-label="Next day">&rarr;</button>
      <button type="button" id="today-btn" class="btn btn-quiet">Today</button>
    </section>

    <section class="progress" aria-live="polite">
      <div class="progress-text" id="progress-text">0 of 0 complete</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </section>

    <form id="add-form" class="card add-form" autocomplete="off">
      <div class="row">
        <input type="text" id="add-title" placeholder="What do you need to do?" aria-label="Task title" required maxlength="200">
        <button type="submit" class="btn">Add</button>
      </div>
      <div class="row">
        <select id="add-priority" aria-label="Priority">
          <option value="High">High priority</option>
          <option value="Medium" selected>Medium priority</option>
          <option value="Low">Low priority</option>
        </select>
        <input type="text" id="add-category" placeholder="Category (e.g. Work)" aria-label="Category" list="category-list" maxlength="40">
      </div>
      <textarea id="add-notes" placeholder="Notes (optional)" aria-label="Notes" rows="2" maxlength="1000"></textarea>
    </form>
    <datalist id="category-list"></datalist>

    <section class="filters" aria-label="Filters">
      <div class="seg" role="group" aria-label="Status filter">
        <button type="button" class="seg-btn" data-status="all" aria-pressed="true">All</button>
        <button type="button" class="seg-btn" data-status="not-complete" aria-pressed="false">Not Complete</button>
        <button type="button" class="seg-btn" data-status="complete" aria-pressed="false">Complete</button>
      </div>
      <select id="category-filter" aria-label="Category filter">
        <option value="all">All categories</option>
      </select>
      <input type="search" id="search" placeholder="Search all days…" aria-label="Search all days">
    </section>

    <div id="carry-bar" class="carry-bar" hidden>
      <span id="carry-text"></span>
      <button type="button" id="carry-btn" class="btn">Move to today</button>
    </div>

    <p id="message" class="message" role="status" hidden></p>

    <h2 id="list-heading" class="list-heading"></h2>
    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <template id="task-template">
    <li class="task">
      <div class="task-main">
        <div class="task-head">
          <span class="task-title"></span>
          <span class="tag tag-priority"></span>
          <span class="tag tag-category"></span>
          <span class="tag tag-date"></span>
        </div>
        <p class="task-notes"></p>
      </div>
      <div class="task-actions">
        <button type="button" class="status-btn" data-action="toggle"></button>
        <button type="button" class="btn btn-quiet btn-small" data-action="edit">Edit</button>
        <button type="button" class="btn btn-quiet btn-small btn-danger" data-action="delete">Delete</button>
      </div>
    </li>
  </template>

  <template id="edit-template">
    <li class="task task-editing">
      <form class="edit-form">
        <input type="text" name="title" aria-label="Task title" required maxlength="200">
        <div class="row">
          <select name="priority" aria-label="Priority">
            <option value="High">High priority</option>
            <option value="Medium">Medium priority</option>
            <option value="Low">Low priority</option>
          </select>
          <input type="text" name="category" placeholder="Category" aria-label="Category" list="category-list" maxlength="40">
        </div>
        <textarea name="notes" placeholder="Notes" aria-label="Notes" rows="2" maxlength="1000"></textarea>
        <div class="row row-end">
          <button type="button" class="btn btn-quiet" data-action="cancel">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </li>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="src/todo-logic.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
